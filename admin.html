<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Vai Voando</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #0b2a3b, #1a4b63);
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 2rem 1.5rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .sidebar .logo i {
            color: #f9d56e;
        }

        .sidebar .user-info {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .sidebar .user-info .avatar {
            font-size: 2.5rem;
            margin-bottom: 0.3rem;
        }

        .sidebar .user-info .name {
            font-weight: 600;
        }

        .sidebar .user-info .role {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            margin-bottom: 0.3rem;
        }

        .sidebar .menu-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .sidebar .menu-item.active {
            background: #f9d56e;
            color: #0b2a3b;
        }

        .sidebar .menu-item i {
            width: 20px;
        }

        .sidebar .logout-btn {
            margin-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1rem;
        }

        .sidebar .logout-btn .menu-item {
            color: #ff6b6b;
        }

        .sidebar .logout-btn .menu-item:hover {
            background: rgba(255,107,107,0.1);
            color: #ff6b6b;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 250px;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 2rem;
            color: #0b2a3b;
        }

        .page-header h1 i {
            color: #f9d56e;
        }

        .page-header .stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .page-header .stat-card {
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
        }

        .page-header .stat-card .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a4b63;
        }

        .page-header .stat-card .label {
            font-size: 0.8rem;
            color: #5f6f80;
        }

        /* ===== CARDS ===== */
        .card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .card .card-header h2 {
            font-size: 1.3rem;
            color: #0b2a3b;
        }

        .card .card-header h2 i {
            color: #f9d56e;
            margin-right: 0.5rem;
        }

        /* ===== FORM ===== */
        .form-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            min-width: 150px;
            padding: 0.7rem 1rem;
            border: 2px solid #e2eaf3;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .form-row input:focus {
            border-color: #1a4b63;
            outline: none;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #1a4b63;
            color: white;
        }

        .btn-primary:hover {
            background: #0b2a3b;
            transform: scale(1.02);
        }

        .btn-success {
            background: #1da851;
            color: white;
        }

        .btn-success:hover {
            background: #178a44;
            transform: scale(1.02);
        }

        .btn-danger {
            background: #e02b4a;
            color: white;
        }

        .btn-danger:hover {
            background: #b01f3a;
            transform: scale(1.02);
        }

        .btn-warning {
            background: #f9d56e;
            color: #0b2a3b;
        }

        .btn-warning:hover {
            background: #f5c842;
            transform: scale(1.02);
        }

        .btn-sm {
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
        }

        /* ===== TABELA ===== */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            text-align: left;
            padding: 0.8rem 0.5rem;
            border-bottom: 2px solid #eef3fa;
            color: #5f6f80;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        table td {
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid #eef3fa;
            vertical-align: middle;
        }

        table tr:hover {
            background: #f8faff;
        }

        table .emoji-cell {
            font-size: 1.8rem;
        }

        table .actions-cell {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #5f6f80;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #dce6f5;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a4b63;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s;
            max-width: 350px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #1da851;
        }

        .toast.error {
            background: #e02b4a;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            max-width: 500px;
            width: 95%;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-box h3 {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-box .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #5f6f80;
        }

        .modal-box .close-modal:hover {
            color: #e02b4a;
        }

        .modal-box input {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-bottom: 0.8rem;
            border: 2px solid #e2eaf3;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .modal-box input:focus {
            border-color: #1a4b63;
            outline: none;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 1rem 0.5rem;
            }

            .sidebar .logo span,
            .sidebar .user-info .name,
            .sidebar .user-info .role,
            .sidebar .menu-item span {
                display: none;
            }

            .sidebar .logo {
                font-size: 1.2rem;
                justify-content: center;
            }

            .sidebar .menu-item {
                justify-content: center;
                padding: 0.8rem;
            }

            .sidebar .user-info .avatar {
                font-size: 1.8rem;
            }

            .main-content {
                margin-left: 70px;
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row {
                flex-direction: column;
            }

            .form-row input {
                min-width: unset;
            }

            .page-header .stats {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 55px;
                padding: 0.5rem 0.3rem;
            }

            .main-content {
                margin-left: 55px;
                padding: 0.8rem;
            }

            .page-header h1 {
                font-size: 1.4rem;
            }

            .card {
                padding: 1rem;
            }

            table {
                font-size: 0.8rem;
            }

            table .actions-cell .btn {
                padding: 0.2rem 0.5rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-plane-departure"></i>
            <span>Vai Voando</span>
        </div>

        <div class="user-info">
            <div class="avatar">👨‍💼</div>
            <div class="name" id="adminName">Administrador</div>
            <div class="role">🔑 Admin</div>
        </div>

        <nav>
            <a href="#" class="menu-item active" onclick="loadPage('dashboard')">
                <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
            </a>
            <a href="#" class="menu-item" onclick="loadPage('destinos')">
                <i class="fas fa-umbrella-beach"></i> <span>Destinos</span>
            </a>
            <a href="#" class="menu-item" onclick="loadPage('adicionar')">
                <i class="fas fa-plus-circle"></i> <span>Adicionar</span>
            </a>
            <a href="#" class="menu-item" onclick="window.open('https://wa.me/5521991864436','_blank')">
                <i class="fab fa-whatsapp"></i> <span>WhatsApp</span>
            </a>
            <a href="#" class="menu-item" onclick="window.open('/vaivoando.html','_blank')">
                <i class="fas fa-external-link-alt"></i> <span>Ver Site</span>
            </a>
        </nav>

        <div class="logout-btn">
            <a href="#" class="menu-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <!-- HEADER -->
        <div class="page-header">
            <h1><i class="fas fa-crown"></i> <span id="pageTitle">Dashboard</span></h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalDestinos">0</div>
                    <div class="label">Destinos</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalClientes">0</div>
                    <div class="label">Clientes</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalVendas">0</div>
                    <div class="label">Vendas</div>
                </div>
            </div>
        </div>

        <!-- ===== CONTEÚDO DINÂMICO ===== -->
        <div id="pageContent">
            <!-- Carregado via JavaScript -->
        </div>
    </main>

    <!-- ===== MODAL EDITAR ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>
                <span><i class="fas fa-edit"></i> Editar Destino</span>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </h3>
            <input type="hidden" id="editId">
            <input type="text" id="editNome" placeholder="Nome do destino">
            <input type="text" id="editPreco" placeholder="Preço (ex: R$ 199,90)">
            <input type="text" id="editEmoji" placeholder="Emoji (ex: 🏖️)">
            <input type="text" id="editParcelas" placeholder="Parcelas (ex: 10x)">
            <input type="text" id="editTexto" placeholder="Descrição">
            <button class="btn btn-primary" onclick="salvarEdicao()" style="width:100%;">
                <i class="fas fa-save"></i> Salvar Alterações
            </button>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================
        const API_BASE = '/api';
        let destinos = [];
        let currentPage = 'dashboard';
        let currentUser = null;

        // ============================================================
        // VERIFICAR LOGIN
        // ============================================================
        function checkAuth() {
            // Verificar se está logado como admin
            const user = JSON.parse(sessionStorage.getItem('adminUser') || 'null');
            if (!user || user.role !== 'admin') {
                // Redirecionar para o site principal
                window.location.href = '/vaivoando.html';
                return false;
            }
            currentUser = user;
            document.getElementById('adminName').textContent = user.name || 'Administrador';
            return true;
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            sessionStorage.removeItem('adminUser');
            window.location.href = '/vaivoando.html';
        }

        // ============================================================
        // FUNÇÕES DE API
        // ============================================================
        async function fetchDestinos() {
            try {
                const response = await fetch(`${API_BASE}/destinos`);
                if (!response.ok) throw new Error('Erro ao buscar destinos');
                return await response.json();
            } catch (error) {
                console.error('❌ Erro fetchDestinos:', error);
                showToast('Erro ao carregar destinos', 'error');
                return getDefaultDestinos();
            }
        }

        async function addDestino(destino) {
            try {
                const response = await fetch(`${API_BASE}/destinos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(destino)
                });
                if (!response.ok) throw new Error('Erro ao adicionar destino');
                return await response.json();
            } catch (error) {
                console.error('❌ Erro addDestino:', error);
                showToast('Erro ao adicionar destino', 'error');
                throw error;
            }
        }

        async function deleteDestino(id) {
            try {
                const response = await fetch(`${API_BASE}/destinos/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Erro ao remover destino');
                return true;
            } catch (error) {
                console.error('❌ Erro deleteDestino:', error);
                showToast('Erro ao remover destino', 'error');
                throw error;
            }
        }

        async function updateDestino(id, data) {
            try {
                const response = await fetch(`${API_BASE}/destinos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error('Erro ao atualizar destino');
                return await response.json();
            } catch (error) {
                console.error('❌ Erro updateDestino:', error);
                showToast('Erro ao atualizar destino', 'error');
                throw error;
            }
        }

        // ============================================================
        // DADOS PADRÃO
        // ============================================================
        function getDefaultDestinos() {
            return [
                { id: 1, nome: "Rio das Ostras", preco: "R$ 153,18", emoji: "🏖️", parcelas: "10x",
                    texto: "Hotel Vilarejo Praia · All Inclusive", whats: "5521991864436" },
                { id: 2, nome: "Búzios", preco: "R$ 219,90", emoji: "⛵", parcelas: "12x",
                    texto: "Pacote Romance · 3 noites", whats: "5521991864436" },
                { id: 3, nome: "Cabo Frio", preco: "R$ 189,00", emoji: "🌊", parcelas: "10x",
                    texto: "All inclusive + passeios", whats: "5521991864436" },
                { id: 4, nome: "Angra dos Reis", preco: "R$ 267,50", emoji: "⛰️", parcelas: "12x",
                    texto: "Ilhas e mergulho", whats: "5521991864436" },
                { id: 5, nome: "Arraial do Cabo", preco: "R$ 204,30", emoji: "🐠", parcelas: "10x",
                    texto: "Pacote familiar", whats: "5521991864436" },
                { id: 6, nome: "Paraty", preco: "R$ 298,00", emoji: "⛪", parcelas: "12x",
                    texto: "História + praias", whats: "5521991864436" }
            ];
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';

            if (type === 'success') toast.classList.add('success');
            if (type === 'error') toast.classList.add('error');

            void toast.offsetWidth;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // PÁGINAS
        // ============================================================
        function loadPage(page) {
            currentPage = page;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

            // Ativar menu
            const menuItems = document.querySelectorAll('.menu-item');
            const pageMap = {
                'dashboard': 0,
                'destinos': 1,
                'adicionar': 2
            };
            if (pageMap[page] !== undefined) {
                menuItems[pageMap[page]]?.classList.add('active');
            }

            const titles = {
                'dashboard': 'Dashboard',
                'destinos': 'Gerenciar Destinos',
                'adicionar': 'Adicionar Destino'
            };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';

            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'destinos':
                    renderDestinosTable();
                    break;
                case 'adicionar':
                    renderAddForm();
                    break;
                default:
                    renderDashboard();
            }
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function renderDashboard() {
            const container = document.getElementById('pageContent');
            const total = destinos.length;

            container.innerHTML = `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1.5rem; margin-bottom:2rem;">
                    <div class="card" style="text-align:center; border-top: 4px solid #f9d56e;">
                        <div style="font-size:2.5rem; color:#1a4b63;">${total}</div>
                        <div style="color:#5f6f80;">Destinos Cadastrados</div>
                    </div>
                    <div class="card" style="text-align:center; border-top: 4px solid #25D366;">
                        <div style="font-size:2.5rem; color:#1da851;">${total * 2}</div>
                        <div style="color:#5f6f80;">Pacotes Disponíveis</div>
                    </div>
                    <div class="card" style="text-align:center; border-top: 4px solid #1a4b63;">
                        <div style="font-size:2.5rem; color:#1a4b63;">${total > 0 ? '✅' : '❌'}</div>
                        <div style="color:#5f6f80;">Status do Site</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-rocket"></i> Ações Rápidas</h2>
                    </div>
                    <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="loadPage('adicionar')">
                            <i class="fas fa-plus"></i> Adicionar Destino
                        </button>
                        <button class="btn btn-success" onclick="loadPage('destinos')">
                            <i class="fas fa-list"></i> Ver Todos
                        </button>
                        <button class="btn btn-warning" onclick="window.open('/vaivoando.html','_blank')">
                            <i class="fas fa-external-link-alt"></i> Ver Site
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-clock"></i> Últimos Destinos</h2>
                    </div>
                    ${total > 0 ? `
                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem;">
                            ${destinos.slice(0, 6).map(d => `
                                <div style="background:#f8faff; padding:1rem; border-radius:12px; text-align:center;">
                                    <div style="font-size:2.5rem;">${d.emoji || '✈️'}</div>
                                    <div style="font-weight:600; margin:0.3rem 0;">${d.nome}</div>
                                    <div style="color:#1a4b63; font-weight:700;">${d.preco}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="empty-state">
                            <i class="fas fa-umbrella-beach"></i>
                            <p>Nenhum destino cadastrado ainda.</p>
                            <button class="btn btn-primary" onclick="loadPage('adicionar')" style="margin-top:1rem;">
                                <i class="fas fa-plus"></i> Adicionar Primeiro Destino
                            </button>
                        </div>
                    `}
                </div>
            `;

            // Atualizar stats
            document.getElementById('totalDestinos').textContent = total;
            document.getElementById('totalClientes').textContent = '👥';
            document.getElementById('totalVendas').textContent = '💰';
        }

        // ============================================================
        // TABELA DE DESTINOS
        // ============================================================
        function renderDestinosTable() {
            const container = document.getElementById('pageContent');

            if (!destinos || destinos.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <i class="fas fa-umbrella-beach"></i>
                            <p>Nenhum destino cadastrado.</p>
                            <button class="btn btn-primary" onclick="loadPage('adicionar')" style="margin-top:1rem;">
                                <i class="fas fa-plus"></i> Adicionar Destino
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-list"></i> Todos os Destinos</h2>
                        <button class="btn btn-primary btn-sm" onclick="loadPage('adicionar')">
                            <i class="fas fa-plus"></i> Novo
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Emoji</th>
                                    <th>Nome</th>
                                    <th>Preço</th>
                                    <th>Parcelas</th>
                                    <th>Descrição</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${destinos.map(d => `
                                    <tr>
                                        <td class="emoji-cell">${d.emoji || '✈️'}</td>
                                        <td><strong>${d.nome}</strong></td>
                                        <td style="color:#1a4b63; font-weight:700;">${d.preco}</td>
                                        <td>${d.parcelas || '10x'}</td>
                                        <td style="font-size:0.85rem; color:#5f6f80;">${d.texto || 'Pacote especial'}</td>
                                        <td>
                                            <div class="actions-cell">
                                                <button class="btn btn-warning btn-sm" onclick="abrirEditar(${d.id})">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button class="btn btn-danger btn-sm" onclick="removerDestino(${d.id})">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // FORMULÁRIO DE ADIÇÃO
        // ============================================================
        function renderAddForm() {
            const container = document.getElementById('pageContent');

            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-plus-circle"></i> Adicionar Novo Destino</h2>
                    </div>
                    <form id="addForm" onsubmit="handleAdd(event)">
                        <div class="form-row">
                            <input type="text" id="addNome" placeholder="Nome do destino*" required>
                            <input type="text" id="addPreco" placeholder="Preço* (ex: R$ 199,90)" required>
                        </div>
                        <div class="form-row">
                            <input type="text" id="addEmoji" placeholder="Emoji (ex: 🏖️)" value="✈️">
                            <input type="text" id="addParcelas" placeholder="Parcelas (ex: 10x)" value="10x">
                        </div>
                        <div class="form-row">
                            <input type="text" id="addTexto" placeholder="Descrição (ex: Pacote especial)">
                        </div>
                        <button type="submit" class="btn btn-success" style="width:100%;">
                            <i class="fas fa-save"></i> Adicionar Destino
                        </button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-lightbulb"></i> Dicas</h2>
                    </div>
                    <ul style="color:#5f6f80; line-height:1.8; padding-left:1.2rem;">
                        <li>Preencha <strong>Nome</strong> e <strong>Preço</strong> (obrigatório)</li>
                        <li>Use emojis para destacar os destinos (ex: 🏖️, ⛵, 🌊)</li>
                        <li>A descrição ajuda o cliente a entender o pacote</li>
                        <li>Após adicionar, o destino aparece automaticamente no site</li>
                    </ul>
                </div>
            `;
        }

        // ============================================================
        // HANDLE ADICIONAR
        // ============================================================
        async function handleAdd(event) {
            event.preventDefault();

            const nome = document.getElementById('addNome').value.trim();
            const preco = document.getElementById('addPreco').value.trim();
            const emoji = document.getElementById('addEmoji').value.trim() || '✈️';
            const parcelas = document.getElementById('addParcelas').value.trim() || '10x';
            const texto = document.getElementById('addTexto').value.trim() || 'Pacote especial';

            if (!nome || !preco) {
                showToast('⚠️ Preencha nome e preço', 'error');
                return;
            }

            // Verificar duplicado
            if (destinos.some(d => d.nome.toLowerCase() === nome.toLowerCase())) {
                showToast('⚠️ Este destino já existe!', 'error');
                return;
            }

            const novoDestino = {
                nome,
                preco,
                emoji,
                parcelas,
                texto,
                whats: '5521991864436'
            };

            try {
                await addDestino(novoDestino);
                destinos = await fetchDestinos();
                showToast('✅ Destino adicionado com sucesso!', 'success');
                document.getElementById('addForm').reset();
                document.getElementById('addEmoji').value = '✈️';
                document.getElementById('addParcelas').value = '10x';
                // Atualizar dashboard
                document.getElementById('totalDestinos').textContent = destinos.length;
                loadPage('destinos');
            } catch (error) {
                showToast('Erro ao adicionar destino', 'error');
            }
        }

        // ============================================================
        // EDITAR DESTINO
        // ============================================================
        function abrirEditar(id) {
            const d = destinos.find(item => item.id === id);
            if (!d) {
                showToast('Destino não encontrado', 'error');
                return;
            }

            document.getElementById('editId').value = d.id;
            document.getElementById('editNome').value = d.nome;
            document.getElementById('editPreco').value = d.preco;
            document.getElementById('editEmoji').value = d.emoji || '✈️';
            document.getElementById('editParcelas').value = d.parcelas || '10x';
            document.getElementById('editTexto').value = d.texto || '';

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function salvarEdicao() {
            const id = parseInt(document.getElementById('editId').value);
            const nome = document.getElementById('editNome').value.trim();
            const preco = document.getElementById('editPreco').value.trim();
            const emoji = document.getElementById('editEmoji').value.trim() || '✈️';
            const parcelas = document.getElementById('editParcelas').value.trim() || '10x';
            const texto = document.getElementById('editTexto').value.trim() || 'Pacote especial';

            if (!nome || !preco) {
                showToast('⚠️ Preencha nome e preço', 'error');
                return;
            }

            try {
                await updateDestino(id, { nome, preco, emoji, parcelas, texto });
                destinos = await fetchDestinos();
                showToast('✅ Destino atualizado com sucesso!', 'success');
                closeEditModal();
                loadPage('destinos');
                document.getElementById('totalDestinos').textContent = destinos.length;
            } catch (error) {
                showToast('Erro ao atualizar destino', 'error');
            }
        }

        // ============================================================
        // REMOVER DESTINO
        // ============================================================
        async function removerDestino(id) {
            if (!confirm('⚠️ Tem certeza que deseja remover este destino?')) return;

            try {
                await deleteDestino(id);
                destinos = await fetchDestinos();
                showToast('🗑️ Destino removido com sucesso!', 'success');
                loadPage('destinos');
                document.getElementById('totalDestinos').textContent = destinos.length;
            } catch (error) {
                showToast('Erro ao remover destino', 'error');
            }
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        async function init() {
            if (!checkAuth()) return;

            try {
                destinos = await fetchDestinos();
                document.getElementById('totalDestinos').textContent = destinos.length;
                renderDashboard();

                console.log('🚀 Admin Vai Voando carregado!');
                console.log(`📦 ${destinos.length} destinos carregados`);
            } catch (error) {
                console.error('❌ Erro na inicialização:', error);
                showToast('Erro ao carregar o painel', 'error');
            }
        }

        // Iniciar
        init();
    </script>
</body>
</html>
